<!DOCTYPE html>
<html lang="en" data-scheme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atoms Test - Simple</title>

    <!-- Base CSS -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">

    <!-- Atoms CSS -->
    <link rel="stylesheet" href="css/components/atoms/button.css">
    <link rel="stylesheet" href="css/components/atoms/led.css">
    <link rel="stylesheet" href="css/components/atoms/rotary.css">

    <style>
        body {
            padding: 40px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        h1 {
            margin-bottom: 32px;
        }

        .test-section {
            background: linear-gradient(135deg, #2a2a2a 0%, #1e1e1e 100%);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #1a1a1a;
        }

        .test-section h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #aaa;
        }

        .grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .log {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #0f0;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Atoms Test - Simple (No Modules)</h1>

    <div class="test-section">
        <h2>Buttons</h2>
        <div class="grid" id="buttons"></div>
    </div>

    <div class="test-section">
        <h2>LEDs</h2>
        <div class="grid" id="leds"></div>
    </div>

    <div class="test-section">
        <h2>Rotaries</h2>
        <div class="grid" id="rotaries"></div>
    </div>

    <div class="test-section">
        <h2>Event Log</h2>
        <div class="log" id="log"></div>
    </div>

    <!-- Load components as global scripts -->
    <script src="js/components/atoms/Button.js"></script>
    <script src="js/components/atoms/LED.js"></script>
    <script src="js/components/atoms/Rotary.js"></script>

    <script>
        const log = (msg) => {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('log').insertBefore(div, document.getElementById('log').firstChild);
        };

        // Test Buttons
        const buttonsDiv = document.getElementById('buttons');
        ['monitor', 'solo', 'phase', 'mute', 'record'].forEach(preset => {
            const container = document.createElement('div');
            buttonsDiv.appendChild(container);
            new window.Button(container, {
                preset: preset,
                onToggle: (active) => log(`${preset}: ${active}`)
            });
        });

        // Test LEDs
        const ledsDiv = document.getElementById('leds');
        [
            { state: 'off', color: 'green' },
            { state: 'active', color: 'green' },
            { state: 'recording', color: 'red' }
        ].forEach(config => {
            const container = document.createElement('div');
            ledsDiv.appendChild(container);
            new window.LED(container, config);
        });

        // Test Rotaries
        const rotariesDiv = document.getElementById('rotaries');
        const thresholdContainer = document.createElement('div');
        rotariesDiv.appendChild(thresholdContainer);
        new window.Rotary(thresholdContainer, {
            preset: 'threshold',
            value: -30,
            onChange: (v) => log(`Threshold: ${v}dB`)
        });

        const gainContainer = document.createElement('div');
        rotariesDiv.appendChild(gainContainer);
        new window.Rotary(gainContainer, {
            preset: 'gain',
            value: 0,
            onChange: (v) => log(`Gain: ${v}dB`)
        });

        log('Test initialized - click buttons, drag rotaries');
    </script>
</body>
</html>
